{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% if student %}Edit{% else %}Add{% endif %} Student</title>
  <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
  <div class="container">
    <h1>{% if student %}Edit Student{% else %}Add a Student{% endif %}</h1>

    {# Use the appropriate action URL: edit when student exists, otherwise add #}
    <form method="POST" action="{% if student %}{% url 'edit' student.id %}{% else %}{% url 'add' %}{% endif %}">
      {% csrf_token %}

      <label for="admission_number">Admission Number:</label>
      <input type="text" id="admission_number" name="admission_number"
             value="{% if student %}{{ student.admission_number }}{% endif %}" required>

      <label for="first_name">First Name:</label>
      <input type="text" id="first_name" name="first_name"
             value="{% if student %}{{ student.first_name }}{% endif %}" required>

      <label for="last_name">Last Name:</label>
      <input type="text" id="last_name" name="last_name"
             value="{% if student %}{{ student.last_name }}{% endif %}" required>

      <label for="course_taken">Course Taken:</label>
      <input type="text" id="course_taken" name="course_taken"
             value="{% if student %}{{ student.course_taken }}{% endif %}" required>

      <label for="enrollment_date">Enrollment Date:</label>
      <input type="date" id="enrollment_date" name="enrollment_date"
             value="{% if student %}{{ student.enrollment_date|date:'Y-m-d' }}{% endif %}"
             {% if student %}{% else %}required{% endif %}>

      <label for="date_of_birth">Date of Birth:</label>
      <input type="date" id="date_of_birth" name="date_of_birth"
             value="{% if student %}{{ student.date_of_birth|date:'Y-m-d' }}{% endif %}" required>

      <label for="gender">Gender:</label>
      <select id="gender" name="gender" required>
        <option value="Male" {% if student and student.gender == "Male" %}selected{% endif %}>Male</option>
        <option value="Female" {% if student and student.gender == "Female" %}selected{% endif %}>Female</option>
        <option value="Other" {% if student and student.gender == "Other" %}selected{% endif %}>Other</option>
      </select>

      <div class="actions form-full" style="margin-top:12px">
        <button type="submit" class="button">{% if student %}Save Changes{% else %}Save Student{% endif %}</button>
        <a href="{% url 'list' %}" class="buttonsecondary" style="margin-left:10px">Cancel</a>
      </div>
    </form>
  </div>
</body>
</html>
